name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infra/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r infra/requirements.txt

      - name: Run tests
        run: python -m unittest tests.unit.test_job_eval tests.integration.test_jev_client -v

      - name: Compile Python modules
        run: python -m compileall -q apps packages tests

      - name: Build Docker image
        run: docker build -f infra/docker/Dockerfile -t zjev:ci .
