[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zjev"
version = "0.0.1a0"
description = "Controlled Python bridge for TypeSafe Jev evaluations"
license = { file = "../LICENSE" }
requires-python = ">=3.10"
dependencies = ["typesafe-sdk>=0.7.1,<1.0.0"]

[tool.pytest.ini_options]
python_files = ["test_*.py"]
